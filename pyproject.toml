[project]
name = "fundamentos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
    "scrapy>=2.19.0",
    "seaborn>=0.13.2",
    "wordcloud>=1.9.6",
]

[project.scripts]
fundamentos = "fundamentos:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
